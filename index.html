<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trendora Shop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f6f7fb;color:#171717}
header{background:#111;color:#fff;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:800;color:#fff}
.cart{background:#fff;color:#111;border:0;border-radius:22px;padding:10px 15px;font-weight:700;cursor:pointer}
.hero{padding:55px 6%;background:linear-gradient(135deg,#171717,#3b3b3b);color:white;text-align:center}
.hero h1{font-size:42px;margin-bottom:12px}
.hero p{font-size:17px;color:#ddd;margin-bottom:22px}
.btn{display:inline-block;background:#fff;color:#111;border:0;border-radius:25px;padding:12px 22px;font-weight:700;cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:28px 5%}
.search{width:100%;padding:14px 18px;border:1px solid #ddd;border-radius:14px;font-size:16px;margin-bottom:22px}
.cats{display:flex;gap:10px;overflow:auto;margin-bottom:25px}
.cat{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:20px;padding:9px 15px;cursor:pointer}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 15px #00000010}
.pic{height:180px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:55px}
.info{padding:15px}
.info h3{font-size:17px;margin-bottom:7px}
.price{font-size:19px;font-weight:800;margin-bottom:12px}
.add{width:100%;padding:11px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700;cursor:pointer}
footer{background:#111;color:#ddd;text-align:center;padding:28px 5%;margin-top:35px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:10px;display:none}
</style>
</head>
<body>
<header>
  <div class="logo">Trendora Shop</div>
  <button class="cart" onclick="showCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>Shop Smart. Live Trendy.</h1>
  <p>Trending products, gadgets, fashion & everyday essentials.</p>
  <button class="btn" onclick="document.getElementById('shop').scrollIntoView()">Shop Now</button>
</section>

<main class="wrap" id="shop">
  <input id="search" class="search" placeholder="🔎 পণ্য খুঁজুন..." oninput="render()">
  <div class="cats">
    <button class="cat" onclick="setCat('All')">সব</button>
    <button class="cat" onclick="setCat('Gadgets')">গ্যাজেট</button>
    <button class="cat" onclick="setCat('Fashion')">ফ্যাশন</button>
    <button class="cat" onclick="setCat('Home')">হোম</button>
  </div>
  <div class="products" id="products"></div>
</main>

<footer>
  <h3>Trendora Shop</h3>
  <p style="margin-top:8px">আপনার অনলাইন শপিংয়ের নতুন ঠিকানা।</p>
  <p style="margin-top:12px">© 2026 Trendora Shop</p>
</footer>
<div id="toast"></div>

<script>
const products=[
 {name:"Wireless Earbuds",price:1290,cat:"Gadgets",icon:"🎧"},
 {name:"Smart Watch",price:1890,cat:"Gadgets",icon:"⌚"},
 {name:"Phone Holder",price:490,cat:"Gadgets",icon:"📱"},
 {name:"Casual T-Shirt",price:650,cat:"Fashion",icon:"👕"},
 {name:"Sunglasses",price:790,cat:"Fashion",icon:"🕶️"},
 {name:"Travel Backpack",price:1190,cat:"Fashion",icon:"🎒"},
 {name:"LED Room Light",price:850,cat:"Home",icon:"💡"},
 {name:"Mini Table Fan",price:1450,cat:"Home",icon:"🌀"},
 {name:"Storage Box",price:550,cat:"Home",icon:"📦"}
];
let cart=0, category="All";
function setCat(c){category=c;render()}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=products.filter(p=>(category==="All"||p.cat===category)&&p.name.toLowerCase().includes(q));
 document.getElementById("products").innerHTML=list.map(p=>`
 <div class="card">
  <div class="pic">${p.icon}</div>
  <div class="info">
   <h3>${p.name}</h3>
   <div class="price">৳${p.price.toLocaleString("en-BD")}</div>
   <button class="add" onclick="addCart()">Add to Cart</button>
  </div>
 </div>`).join("");
}
function addCart(){
 cart++; document.getElementById("count").textContent=cart;
 const t=document.getElementById("toast");t.textContent="✅ Cart-এ পণ্য যোগ হয়েছে";t.style.display="block";
 setTimeout(()=>t.style.display="none",1300);
}
function showCart(){alert(cart?`আপনার Cart-এ ${cart}টি পণ্য আছে।`:"Cart এখন খালি।")}
render();
</script>
</body>
</html>
